[pytest]
asyncio_mode = auto
# The live tests need credentials and the network: they run only with -m integration.
addopts = -m "not integration"
markers =
    integration: live tests against the Veolia site (need VEOLIAIDF_USERNAME and VEOLIAIDF_PASSWORD)
testpaths = tests
log_level = DEBUG
log_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
log_cli = False
log_file_level = DEBUG
log_file_format = %(asctime)s %(levelname)s [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
log_file = log/pytest.log
