name: 'python-lint'
description: 'Python linting workflow'

inputs:
  python-version:
    description: 'Python version'
    required: true
    default: '3.12'

runs:
  using: "composite"
  steps:
    #----------------------------------------------
    #  Set-up python
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    #----------------------------------------------
    # Install uv
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    #----------------------------------------------
    # Install project (fails if uv.lock is out of date)
    #----------------------------------------------
    - name: Install project
      shell: bash
      run: uv sync --locked --python ${{ inputs.python-version }}

    #----------------------------------------------
    #  Run Flake8
    - name: Flake8
      shell: bash
      run: uv run flake8 . --exclude=.venv,build,dist --count --ignore=E501 --show-source --statistics
