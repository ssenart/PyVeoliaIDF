[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pyveoliaidf"
version = "0.4.6a1"
description = "Retrieve water consumption from Veolia Ile-de-France web site (French Water Company)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stephane Senart", email = "stephane.senart@gmail.com" }]
keywords = ["Resource", "Water", "Meter", "Consumption", "Veolia", "Ile-de-France"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.10",
    "certifi>=2023.7.22",
    "pydantic>=2.10",
]

[project.urls]
Home = "https://github.com/ssenart/pyveoliaidf"
Source = "https://github.com/ssenart/pyveoliaidf"
Issues = "https://github.com/ssenart/pyveoliaidf/issues"
Changelog = "https://github.com/ssenart/pyveoliaidf/blob/master/CHANGELOG.md"
Download = "https://pypi.org/project/pyveoliaidf"

[project.scripts]
pyveoliaidf = "pyveoliaidf.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyveoliaidf"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "python-dotenv",
    "ruff>=0.17.0",
]

[tool.uv]
# The development environment is made of the dependency groups above.
# The package itself is installed in editable mode by `uv sync`.

[tool.mypy]
strict = true
exclude = [ ".venv" ]

[tool.ruff]
exclude = [ ".venv", "*.md" ]
line-length = 120

[tool.ruff.lint]
# E501 is ignored: ruff format owns the line length, and long strings are left as they are.
select = ["E", "F", "W", "I", "N", "B", "UP", "ARG", "RET", "BLE"]
ignore = ["E501"]

[tool.coverage.run]
source = ["pyveoliaidf"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ["\\.\\.\\.$", "if TYPE_CHECKING:"]

[tool.ruff.lint.per-file-ignores]
# The fakes and the hooks of the tests have to take arguments that they do not use.
"tests/*" = ["ARG"]
